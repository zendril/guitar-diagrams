arker-disc" r="17"/><text class="marker-label" x="0" y="1">♭3</text></g><g transform="translate(108 340)"><g transform="translate(0 0)"><circle class="legend-core" cx="0" cy="0" r="8"/><text class="legend-text" x="15" y="1">pentatonic core</text></g><g transform="translate(210 0)"><circle class="legend-optional" cx="0" cy="0" r="8"/><text class="legend-text" x="15" y="1">modal color tone</text></g><g transform="translate(420 0)"><circle class="legend-tonic" style="stroke:#dc2626" cx="0" cy="0" r="11"/><circle class="legend-core" cx="0" cy="0" r="8"/><text class="legend-text" x="15" y="1">tonic</text></g></g></svg>

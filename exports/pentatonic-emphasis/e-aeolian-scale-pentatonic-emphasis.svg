<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10in" height="4.0625in" viewBox="0 0 960 390" role="img" aria-labelledby="e-aeolian-combined-title e-aeolian-combined-desc" data-mode-id="e-aeolian" data-view="combined" data-overlay="none"><title id="e-aeolian-combined-title">E Aeolian — full mode with pentatonic emphasis</title><desc id="e-aeolian-combined-desc">E Aeolian seven-note position. Filled markers belong to E minor pentatonic; hollow markers are modal color tones outside that core. String 1: fret 12 E, degree 1 tonic; fret 14 F♯, degree 2; fret 15 G, degree ♭3. String 2: fret 12 B, degree 5; fret 13 C, degree ♭6; fret 15 D, degree ♭7. String 3: fret 11 F♯, degree 2; fret 12 G, degree ♭3; fret 14 A, degree 4. String 4: fret 12 D, degree ♭7; fret 14 E, degree 1 tonic. String 5: fret 12 A, degree 4; fret 14 B, degree 5; fret 15 C, degree ♭6. String 6: fret 12 E, degree 1 tonic; fret 14 F♯, degree 2; fret 15 G, degree ♭3</desc><style>
        svg{background:#fff;color:#111827;font-family:Inter,Segoe UI,Arial,sans-serif;text-rendering:geometricPrecision}
        text{fill:#111827}
        .diagram-title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#4b5563}.formula{font-size:15px;font-weight:650;text-anchor:end}
        .fret,.string{stroke:#6b7280;vector-effect:non-scaling-stroke}.fret{stroke-width:1px}.string{stroke-linecap:round}
        .fret-label,.string-label{font-size:13px;fill:#4b5563;text-anchor:middle;dominant-baseline:middle}
        .string-label{text-anchor:end}.position-outline{fill-opacity:.055;stroke-width:4;stroke-linejoin:round;vector-effect:non-scaling-stroke}
        .marker-disc{stroke:#111827;stroke-width:2;vector-effect:non-scaling-stroke}.core .marker-disc,.equal .marker-disc{fill:#111827}.optional .marker-disc{fill:#fff}
        .marker-label{font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.core .marker-label,.equal .marker-label{fill:#fff}.optional .marker-label{fill:#111827}
        .overlay-highlight .marker-disc{stroke:#b45309;stroke-width:5}
        .tonic-ring{fill:none;stroke-width:3;vector-effect:non-scaling-stroke}
        .legend-core,.legend-equal{fill:#111827;stroke:#111827;stroke-width:1.5}.legend-optional{fill:#fff;stroke:#111827;stroke-width:1.8}.legend-tonic{fill:none;stroke-width:2.5}.legend-overlay{fill:#111827;stroke:#b45309;stroke-width:4}
        .legend-text{font-size:13px;fill:#374151;dominant-baseline:middle}.overlay-caption{font-size:13px;font-weight:650;fill:#92400e}
      </style><rect width="960" height="390" fill="#fff"/><text class="diagram-title" x="108" y="39">Aeolian</text><text class="subtitle" x="108" y="63">Mode vi · pentatonic emphasized · hollow 2 and ♭6 are modal color tones</text><text class="formula" x="918" y="45">1  2  ♭3  4  5  ♭6  ♭7</text><path class="position-outline" style="fill:#dc2626;stroke:#dc2626" d="M 329 120 L 859 120 L 859 152.8 L 859 152.8 L 859 182.39999999999998 L 697 182.39999999999998 L 697 212 L 697 212 L 697 241.6 L 859 241.6 L 859 271.2 L 859 271.2 L 859 304 L 329 304 L 329 271.2 L 329 271.2 L 329 241.6 L 329 241.6 L 329 212 L 167 212 L 167 182.39999999999998 L 329 182.39999999999998 L 329 152.8 L 329 152.8 Z"/><line class="fret" x1="108" y1="117" x2="108" y2="307"/><line class="fret" x1="270" y1="117" x2="270" y2="307"/><line class="fret" x1="432" y1="117" x2="432" y2="307"/><line class="fret" x1="594" y1="117" x2="594" y2="307"/><line class="fret" x1="756" y1="117" x2="756" y2="307"/><line class="fret" x1="918" y1="117" x2="918" y2="307"/><line class="string" style="stroke-width:1.00px" x1="108" y1="138" x2="918" y2="138"/><text class="string-label" x="80" y="139">1 · e</text><line class="string" style="stroke-width:1.28px" x1="108" y1="167.6" x2="918" y2="167.6"/><text class="string-label" x="80" y="168.6">2 · B</text><line class="string" style="stroke-width:1.56px" x1="108" y1="197.2" x2="918" y2="197.2"/><text class="string-label" x="80" y="198.2">3 · G</text><line class="string" style="stroke-width:1.84px" x1="108" y1="226.8" x2="918" y2="226.8"/><text class="string-label" x="80" y="227.8">4 · D</text><line class="string" style="stroke-width:2.12px" x1="108" y1="256.4" x2="918" y2="256.4"/><text class="string-label" x="80" y="257.4">5 · A</text><line class="string" style="stroke-width:2.40px" x1="108" y1="286" x2="918" y2="286"/><text class="string-label" x="80" y="287">6 · E</text><text class="fret-label" x="189" y="105">11</text><text class="fret-label" x="351" y="105">12</text><text